name: Finance App Test CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    # Define a postgres service container for Github Actions
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgresuser
          POSTGRES_PASSWORD: "testpassword123"
          POSTGRES_DB: finance_db # Main DB name if any tests unexpectedly hit it
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pytest Test Suite
      # pytest-env reads from pytest.ini which maps to these same connection strings
      env:
        DATABASE_HOSTNAME: localhost
        DATABASE_PORT: 5432
        DATABASE_USERNAME: postgresuser
        DATABASE_PASSWORD: "testpassword123"
        DATABASE_NAME: finance_test_db
        TEST_DATABASE_NAME: finance_test_db
        DATABASE_URL: "postgresql+psycopg2://postgresuser:testpassword123@localhost:5432/finance_test_db"
        SECRET_KEY: test_secret_key_1234
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        GEMINI_API_KEY: dummy_api_key
        GEMINI_MODEL_NAME: gemini-3-flash-preview
        PYTHONPATH: .
      run: |
        python -m pytest app/tests -v
